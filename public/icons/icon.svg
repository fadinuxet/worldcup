<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0f14"/>
  <!-- ball -->
  <circle cx="256" cy="256" r="170" fill="#f4fff7" stroke="#00ff85" stroke-width="12"/>
  <!-- centre pentagon -->
  <polygon points="256,212 298,243 282,292 230,292 214,243" fill="#0a0f14"/>
  <!-- seams from the centre pentagon out to the edge spots -->
  <g stroke="#0a0f14" stroke-width="13" stroke-linecap="round">
    <line x1="256" y1="212" x2="256" y2="112"/>
    <line x1="298" y1="243" x2="394" y2="208"/>
    <line x1="282" y1="292" x2="340" y2="378"/>
    <line x1="230" y1="292" x2="172" y2="378"/>
    <line x1="214" y1="243" x2="118" y2="208"/>
  </g>
  <!-- edge pentagon spots -->
  <g fill="#0a0f14">
    <circle cx="256" cy="104" r="15"/>
    <circle cx="400" cy="202" r="15"/>
    <circle cx="346" cy="384" r="15"/>
    <circle cx="166" cy="384" r="15"/>
    <circle cx="112" cy="202" r="15"/>
  </g>
</svg>
