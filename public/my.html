<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My World Cup — Follow Your Teams</title>
<meta name="theme-color" content="#00ff85"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/tw-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@100..900&family=Hanken+Grotesk:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link href="/css/app.css" rel="stylesheet"/>
</head>
<body class="font-body-md bg-surface-container-lowest pb-20 md:pb-8">
<div id="top-nav"></div>
<main class="max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop pt-24">
  <h1 class="font-headline-lg text-3xl md:text-5xl font-black tracking-tight mb-1">My World Cup</h1>
  <p class="font-body-md text-on-surface-variant mb-6">Your teams, your matches, your alerts — saved on this device.</p>

  <!-- Alerts toggle -->
  <section id="alerts" class="bg-surface-container rounded-xl border border-outline-variant/20 p-4 mb-8 flex items-center justify-between gap-4" hidden>
    <div class="min-w-0">
      <p class="font-headline-md text-base font-bold flex items-center gap-2"><span class="material-symbols-outlined text-primary-fixed-dim">notifications_active</span> Match alerts</p>
      <p id="alerts-desc" class="font-label-data text-on-surface-variant mt-1">Get a push when your teams kick off, score, or finish.</p>
    </div>
    <button id="alerts-btn" class="font-label-match text-xs tracking-widest px-4 py-2 rounded-xl bg-primary-container text-on-primary-container whitespace-nowrap">ENABLE</button>
  </section>

  <!-- My Teams -->
  <section class="mb-8">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-headline-md text-xl font-bold">My Teams</h2>
      <a href="/teams.html" class="font-label-match text-xs tracking-widest text-secondary-container hover:text-primary-fixed-dim">+ ADD TEAMS</a>
    </div>
    <div id="my-teams"></div>
  </section>

  <!-- Upcoming for you -->
  <section class="mb-8">
    <h2 class="font-headline-md text-xl font-bold mb-3">Upcoming For You <span id="live-count" class="font-label-match text-xs text-primary-fixed-dim"></span></h2>
    <div id="my-matches" class="grid gap-3"></div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/follow.js"></script>
<script src="/js/components.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/live.js"></script>
<script src="/js/push.js"></script>
<script src="/js/page-my.js"></script>
</body>
</html>
